<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Этажом ниже — еда для фитнес-клуба</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#17201b; --muted:#68706a; --line:#e7e3da; --soft:#efece5;
  --brand:#1d6b45; --brand-ink:#0f3f28; --lime:#c9f26b; --hit:#f2b01e; --sale:#e3463a;
  --blue:#2f7fd1; --orange:#e8743b; --violet:#7b5cc4; --green:#2e9b5b; --red:#d9443a; --grey:#97a09a;
  --r:16px; --r-sm:10px; --sh:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.06);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.hide{display:none!important}
.m-only{display:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.b{font-weight:700}
.nowrap{white-space:nowrap}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.num{font-variant-numeric:tabular-nums}

/* демо-панель */
.demobar{position:sticky;top:0;z-index:60;background:#111814;color:#dfe6e1;display:flex;align-items:center;gap:14px;padding:7px 16px;font-size:13px}
.demobar .tag{font-weight:700;color:#fff;letter-spacing:.2px}
.seg{display:inline-flex;background:#26302a;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#cfd8d2;padding:5px 14px;border-radius:999px;font-weight:600;font-size:13px}
.seg button.on{background:var(--lime);color:#14200f}
.dbstate{display:flex;align-items:center;gap:7px;color:#b7c2bb}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey);display:inline-block}
.dot.live{background:#59d38a;box-shadow:0 0 0 3px rgba(89,211,138,.2)}
.dot.local{background:#f2b01e}
.demobar .reset{border:1px solid #3a463f;background:transparent;color:#cfd8d2;border-radius:8px;padding:4px 10px;font-size:12px}

/* шапка сайта */
.site-head{position:sticky;top:38px;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.site-head .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .mark{width:38px;height:38px;border-radius:11px;background:var(--brand);display:grid;place-items:center}
.logo .t1{font-weight:800;font-size:18px;letter-spacing:-.3px;line-height:1.1}
.logo .t2{font-size:12px;color:var(--muted);line-height:1.1}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn:hover{border-color:#cfc9bc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#14200f}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.lg{padding:13px 20px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .cnt{background:var(--lime);color:#14200f;border-radius:999px;padding:0 7px;font-size:12px;font-weight:800}
.btn.primary .cnt{background:var(--lime)}

/* главная клиента */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin:22px 0 8px}
.hero .main{background:var(--brand);color:#fff;border-radius:24px;padding:30px 32px;position:relative;overflow:hidden}
.hero h1{margin:0 0 10px;font-size:36px;line-height:1.08;letter-spacing:-1px;font-weight:800;max-width:560px}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero p{margin:0 0 18px;max-width:520px;color:#d6e8dc;font-size:16px}
.steps{display:flex;gap:10px;flex-wrap:wrap}
.steps .s{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.steps .s b{background:var(--lime);color:#14200f;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.hero .stairs{position:absolute;right:-10px;bottom:-10px;opacity:.16}
.hero .side{background:#fff;border-radius:24px;padding:22px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px}
.hero .side .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.hero .side .kv{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px;font-size:14px}

.goals{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin:18px 0 12px}
.goal{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 10px 9px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:74px;transition:.15s}
.goal .ic{font-size:20px;line-height:1}
.goal .nm{font-weight:700;font-size:13.5px;line-height:1.15}
.goal .hn{font-size:11.5px;color:var(--muted)}
.goal.on{border-color:var(--gc,var(--ink));background:color-mix(in srgb,var(--gc,#000) 12%,#fff);box-shadow:inset 0 0 0 1px var(--gc,var(--ink))}
.goal[data-id="lose"],.goal[data-id="gain"],.goal[data-id="balance"]{border-color:color-mix(in srgb,var(--gc) 55%,#fff);background:color-mix(in srgb,var(--gc) 8%,#fff)}
.goal[data-id="lose"].on,.goal[data-id="gain"].on,.goal[data-id="balance"].on{background:color-mix(in srgb,var(--gc) 18%,#fff)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.input,select.input,textarea.input{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;outline:none;min-width:0}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,107,69,.12)}
.search{flex:1;min-width:200px;max-width:360px;position:relative}
.search .input{width:100%;padding-left:34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}

.sec-h{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}
.sec-h h2{margin:0;font-size:22px;letter-spacing:-.4px}
.sec-h .muted{font-size:14px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.rail>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

.dish{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.dish:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(20,30,25,.06),0 12px 28px rgba(20,30,25,.1)}
.dish .pic{height:132px;display:grid;place-items:center;font-size:62px;position:relative;background:radial-gradient(circle at 30% 25%,#fff 0,transparent 60%),linear-gradient(135deg,color-mix(in srgb,var(--gc) 38%,#fff),color-mix(in srgb,var(--gc) 14%,#fff))}
.dish{border-top:4px solid var(--gc)}
.dish .pic .em{filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.badges{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:800;border-radius:7px;padding:3px 7px;letter-spacing:.2px;background:#fff;color:var(--ink)}
.badge.hit{background:var(--hit);color:#2b1d00}
.badge.sale{background:var(--sale);color:#fff}
.badge.out{background:#2b2f2c;color:#fff}
.kcal{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.9);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
.dish .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.dish .nm{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.dish .meta{font-size:12.5px;color:var(--muted)}
.macros{display:flex;gap:6px;font-size:12px}
.macros span{background:var(--soft);border-radius:7px;padding:2px 7px;font-weight:600}
.macros span b{color:var(--muted);font-weight:600;margin-right:3px}
.dish .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.price{font-weight:800;font-size:17px}
.old{color:var(--muted);text-decoration:line-through;font-size:13px;font-weight:600}
.left{font-size:12px;font-weight:700;color:var(--orange)}
.dish.soldout{opacity:.62}
.dish.soldout .pic{filter:grayscale(.8)}
.add{margin-left:auto;width:38px;height:38px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center}
.add:disabled{background:#c9cdc9}
.stepper{margin-left:auto;display:inline-flex;align-items:center;background:var(--soft);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:transparent;width:32px;height:34px;font-size:18px;font-weight:700}
.stepper button:disabled{opacity:.35}
.stepper span{min-width:22px;text-align:center;font-weight:800}
.goal-dots{display:flex;gap:4px;flex-wrap:wrap}
.gdot{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;color:color-mix(in srgb,var(--gc) 72%,#000);background:color-mix(in srgb,var(--gc) 14%,#fff)}
.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border-radius:var(--r);border:1px dashed var(--line)}

/* плавающая плашка заказа */
.orderpill{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:55;background:var(--ink);color:#fff;border-radius:999px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);border:0;font-weight:600}
.orderpill .st{background:var(--lime);color:#14200f;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800}

/* модалки и панель */
.overlay{position:fixed;inset:0;background:rgba(15,22,18,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay.anim{animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:22px;width:min(720px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);position:relative}
.modal.wide{width:min(980px,100%)}
.modal .mh{padding:18px 22px 6px;display:flex;align-items:flex-start;gap:12px}
.modal .mh h3{margin:0;font-size:20px;letter-spacing:-.3px;flex:1}
.modal .mb{padding:8px 22px 20px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.dm-top{display:grid;grid-template-columns:240px 1fr;gap:20px}
.dm-pic{height:220px;border-radius:18px;display:grid;place-items:center;font-size:96px;background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 24%,#fff),color-mix(in srgb,var(--gc) 6%,#fff))}
.kbju{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.kbju div{background:var(--soft);border-radius:12px;padding:8px 10px}
.kbju b{display:block;font-size:18px}
.kbju span{font-size:12px;color:var(--muted)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:90;box-shadow:-20px 0 60px rgba(0,0,0,.18);display:flex;flex-direction:column}
.drawer.anim{animation:slide .2s}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .dh h3{margin:0;flex:1;font-size:19px}
.drawer .db{padding:16px 20px;overflow:auto;flex:1}
.drawer .df{padding:14px 20px;border-top:1px solid var(--line)}
.ci{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft)}
.ci .e{font-size:28px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--soft)}
.ci .n{flex:1;font-weight:600;font-size:14px;line-height:1.25}
.sum-row{display:flex;justify-content:space-between;padding:4px 0}
.sum-row.total{font-size:18px;font-weight:800;padding-top:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field .input{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:7px 11px;font-weight:600;font-size:13.5px}
.chip.on{border-color:var(--brand);background:#e9f4ee;color:var(--brand-ink)}
.paym{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paym button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:700}
.paym button.on{border-color:var(--brand);background:#e9f4ee}
.paym small{display:block;font-weight:500;color:var(--muted)}
.note{background:#fff7e0;border:1px solid #f3e1a6;border-radius:12px;padding:10px 12px;font-size:13px}
.note.green{background:#eaf6ef;border-color:#cfe8da}
.note.red{background:#fdecea;border-color:#f6c9c4}
.qr{width:150px;height:150px;margin:6px auto;display:block}
.success{text-align:center;padding:10px 0}
.success .ok{width:70px;height:70px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin:8px auto 10px;font-size:34px}
.code{font-size:44px;font-weight:800;letter-spacing:6px;font-variant-numeric:tabular-nums}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--brand);animation:spin 1s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.track{display:flex;flex-direction:column;gap:0;margin:14px 0}
.tstep{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.tstep:not(:last-child)::before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tstep .c{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800}
.tstep.done .c{background:var(--brand);border-color:var(--brand);color:#fff}
.tstep.done:not(:last-child)::before{background:var(--brand)}
.tstep.cur .c{border-color:var(--brand);box-shadow:0 0 0 4px rgba(29,107,69,.15)}
.tstep .t{font-weight:700}
.tstep .w{font-size:12.5px;color:var(--muted)}

/* админка */
.admin-head{position:sticky;top:38px;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.admin-head .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.atabs{display:flex;gap:4px;flex-wrap:wrap}
.atab{border:0;background:transparent;padding:9px 13px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
.atab.on{background:var(--soft);color:var(--ink)}
.atab .n{background:var(--sale);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.awrap{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.ah{display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.ah h2{margin:0;font-size:24px;letter-spacing:-.5px}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;background:#fff;border-radius:12px;padding:4px 12px;border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:var(--orange)}
.kpi.bad .v{color:var(--red)}
.panel{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:16px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.col{background:var(--soft);border-radius:16px;padding:10px;min-height:200px}
.col h4{margin:2px 4px 10px;font-size:13.5px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.col h4 .n{background:#fff;color:var(--ink);border-radius:999px;padding:0 8px;font-size:12px}
.tk{background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);border-left:4px solid var(--grey)}
.tk.s-paid{border-left-color:var(--blue)}
.tk.s-due{border-left-color:var(--orange)}
.tk.s-cooking{border-left-color:var(--orange)}
.tk.s-packed{border-left-color:var(--violet)}
.tk.late{background:#fff4f2}
.tk .top{display:flex;align-items:baseline;gap:8px}
.tk .cd{font-weight:800;font-size:18px;letter-spacing:1px}
.tk .who{font-weight:600}
.tk .tm{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.tk .tm b{color:var(--ink)}
.tk .tm .bad{color:var(--red);font-weight:700}
.tk ul{margin:0 0 8px;padding:0;list-style:none;font-size:13.5px}
.tk li{display:flex;gap:6px;padding:2px 0}
.tk li .q{font-weight:800;min-width:24px}
.tk .cm{font-size:12.5px;background:#fff7e0;border-radius:8px;padding:4px 8px;margin-bottom:8px}
.tk .acts{display:flex;gap:6px}
.tk .acts .btn{flex:1;justify-content:center}
.prep{display:flex;flex-wrap:wrap;gap:8px}
.prep .pi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 10px;display:flex;gap:8px;align-items:center;font-size:13.5px}
.prep .pi b{font-size:16px}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff}
table.t td{padding:8px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
table.t tr:hover td{background:#fbfaf7}
table.t td.r,table.t th.r{text-align:right}
table.t .input{padding:5px 8px;border-radius:8px;width:76px}
.tw{overflow:auto;max-height:70vh;border-radius:12px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st.ok{background:#e6f4ec;color:#1e7a47}
.st.low{background:#fff1d6;color:#9a6200}
.st.out{background:#fde4e1;color:#b2271d}
.st.blue{background:#e4effb;color:#1f64ad}
.st.violet{background:#efe9fb;color:#5b3fa6}
.st.grey{background:#eeefee;color:#5d645f}
.st.orange{background:#fdeee3;color:#b0531c}
.st.green{background:#e6f4ec;color:#1e7a47}
.st.red{background:#fde4e1;color:#b2271d}
.tog{width:40px;height:23px;border-radius:999px;border:0;background:#d5d8d5;position:relative;transition:.15s;flex:none}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--brand)}
.tog.on.hitc{background:var(--hit)}
.tog.on.stopc{background:var(--red)}
.tog.on::after{left:20px}
.rec{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);margin-bottom:8px;font-size:13.5px}
.rec .ic{font-size:22px}
.rec .tx{flex:1}
.bar-h{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.bar-h .lb{width:230px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-h .tr{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar-h .tr i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.bar-h .vl{width:80px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.po{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}
.po .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.po .ph b{font-size:15px}
.po table{margin-top:8px}
.settings{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.settings label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.settings input[type=range]{width:140px;accent-color:var(--brand)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.banner{background:#fff7e0;border:1px solid #f3e1a6;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.rc{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.rc .cd{font-size:30px;font-weight:800;letter-spacing:3px;min-width:96px}
.rc.hl{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,107,69,.12)}
.recipe-row{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;margin-bottom:6px}
.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:11px 15px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:360px;transition:.3s}
.toast.ok{background:var(--brand)}
.toast.warn{background:#9a4b12}
.toast.out{opacity:0;transform:translateY(8px)}

footer.f{max-width:1240px;margin:40px auto 0;padding:20px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap}

@media (max-width:1100px){
  .goals{grid-template-columns:repeat(5,1fr)}
  .cols{grid-template-columns:repeat(2,1fr)}
  .grid3,.grid2{grid-template-columns:1fr}
}
@media (max-width:760px){
  .demobar{position:relative;padding:6px 10px}
  .site-head,.admin-head{top:0!important}
  .demobar .reset{padding:3px 8px}
  .seg button{padding:5px 10px}
  .logo .t1{font-size:16px;white-space:nowrap}
  .logo .mark{width:34px;height:34px}
  .site-head .btn{padding:8px 11px}
  .cart-lbl{display:none}
  .hero .side{display:none}
  .m-only{display:block!important}
  .hero .stairs{display:none}
  .steps .s{padding:6px 10px;font-size:12.5px}
  .goals{display:flex;overflow-x:auto;gap:8px;margin:14px -14px 8px;padding:0 14px 4px;scrollbar-width:none}
  .goal{flex:0 0 132px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px;padding:0 14px 2px;scrollbar-width:none}
  .tab{white-space:nowrap}
  .search{min-width:0;max-width:none}
  .toolbar select.input{max-width:150px}
  .hero{grid-template-columns:1fr}
  .hero h1{font-size:28px}
  .hero .main{padding:22px}
  .goals{grid-template-columns:repeat(3,1fr)}
  .goal{min-height:64px;padding:8px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .dish .pic{height:104px;font-size:48px}
  .dish .body{padding:10px}
  .dish .nm{font-size:14px}
  .macros{display:none}
  .site-head .in{padding:10px 14px}
  .logo .t2{display:none}
  .wrap{padding:0 14px}
  .dm-top{grid-template-columns:1fr}
  .dm-pic{height:150px;font-size:72px}
  .cols{grid-template-columns:1fr}
  .demobar{flex-wrap:wrap;gap:8px}
  .demobar .tag{display:none}
  .formgrid{grid-template-columns:1fr 1fr}
  .hide-m{display:none!important}
}

/* ===== v2: время, QR, официант, шкаф, постер ===== */
.minbox{display:flex;align-items:baseline;gap:10px;background:#eaf6ef;border:1px solid #cfe8da;border-radius:12px;padding:10px 12px}
.minbox b{font-size:22px;font-variant-numeric:tabular-nums}
.qr{width:150px;height:150px;display:block;margin:6px auto;image-rendering:pixelated}
.qr.big{width:170px;height:170px;margin:0}
.qrbox{display:flex;gap:14px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.qrbox.dim .qr{opacity:.35}
.parts{display:flex;flex-direction:column;gap:8px;margin:8px 0 10px}
.part{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.part .pi{font-size:22px}
.track.hz{flex-direction:row;gap:0;margin:4px 0 14px}
.track.hz .tstep{flex:1;flex-direction:column;align-items:center;text-align:center;padding-bottom:0;font-size:12px}
.track.hz .tstep::before{display:none}
.track.hz .tstep .t{font-size:12px;line-height:1.2;margin-top:4px}
.wwrap{max-width:560px;margin:0 auto;padding:14px 14px 80px}
.wsec{margin-bottom:18px}
.wsec h3{margin:6px 0 10px;font-size:16px}
.wcard{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--violet)}
.wcard.late{border-left-color:var(--red)}
.wcard.hl{box-shadow:0 0 0 3px rgba(29,107,69,.3)}
.wcard .top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.wcard .cd{font-weight:800;font-size:22px;letter-spacing:1px}
.wpart{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.wpart .wi{font-size:22px}
.cellqr{align-items:flex-start}
.cellqr .qr{width:130px;height:130px;margin:0}
.cellid{font-size:44px;font-weight:800;letter-spacing:2px;line-height:1}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cells.big{grid-template-columns:repeat(3,1fr)}
.cell{border-radius:12px;padding:10px;border:2px solid var(--line);background:#fff;min-height:74px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.cell .row{justify-content:space-between}
.cell .cl{font-weight:600}
.cell.s-reserved{border-style:dashed;border-color:var(--blue);background:#f2f7fd}
.cell.s-occupied{border-color:var(--green);background:#eaf6ef}
.cell.s-open{border-color:var(--hit);background:#fff7e0;box-shadow:0 0 0 3px rgba(242,176,30,.25)}
.cells.big .cell{min-height:110px}
.locker{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
.screen{background:#1b211d;border-radius:22px;padding:16px;color:#e8efe9;box-shadow:var(--sh)}
.scr{background:#0e130f;border-radius:14px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:16px;font-weight:600}
.scr .big{font-size:46px;line-height:1;margin-bottom:8px}
.scr.ok{background:#16351f;color:#c9f26b}
.scr.bad{background:#3a1512;color:#ffb4ab}
.sim{background:#fff;color:var(--ink);border-radius:14px;padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.sim .btn{justify-content:flex-start}
body[data-app="poster"] #head{display:none}
.poster-wrap{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:24px}
.poster{background:#fff;border-radius:28px;box-shadow:var(--sh);padding:36px;max-width:520px;text-align:center}
.poster .row{justify-content:center}
.poster h1{font-size:36px;letter-spacing:-1px;margin:22px 0 8px}
.poster p{color:var(--muted);font-size:16px}
.poster-qr{width:280px;height:280px;margin:16px auto}
.steps.dark{justify-content:center;margin-top:10px}
.steps.dark .s{background:var(--soft);border-color:var(--line);color:var(--ink)}
@media (max-width:1100px){ .locker{grid-template-columns:1fr} }
@media (max-width:760px){
  .track.hz .tstep .t{font-size:10.5px}
  .qrbox{flex-direction:column;text-align:center}
  .seg{overflow-x:auto;max-width:100%}
  .seg button{white-space:nowrap}
}
@media (max-width:760px){
  .admin-head .in{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .admin-head .atabs{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .atab{white-space:nowrap;padding:7px 10px}
  .clock{font-size:16px;padding:2px 8px}
  .awrap{padding:12px 12px 60px}
  .ah h2{font-size:20px}
  .ah .muted{font-size:13px}
  .cells.big{grid-template-columns:repeat(3,1fr)}
  .poster{padding:22px}
  .poster-qr{width:220px;height:220px}
}
.sub-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.sub-h h3{margin:0;font-size:17px}
.subtabs .tab{background:#f8f7f3}
.subtabs .tab.on{background:var(--brand);border-color:var(--brand)}
.part.ok{background:#e3f5e9;border:1.5px solid #9fd8b3}
.part.pcol{flex-direction:column;align-items:stretch}
.part.pcol .row{align-items:flex-start}
.btn.green{background:#fff;border-color:var(--brand);color:var(--brand-ink)}
.gotbtn{width:100%;justify-content:center;margin-top:10px;padding:12px;font-size:15px}
.cell .rel{margin-top:auto;padding:4px 8px;font-size:12px}
.part .qrbox{margin:8px 0 0}
.wpart.wcol{flex-direction:column;align-items:stretch;gap:8px}

.wbtn{width:100%;justify-content:center;margin-top:6px;padding:12px}

/* ===== Чеки ===== */
.rcbox{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rcrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:13.5px}
.rcrow:first-of-type{border-top:0}
.rcrow .ri{font-size:18px}
.pulse{color:var(--orange);animation:pl 1s infinite alternate}
@keyframes pl{from{opacity:.3}to{opacity:1}}
.paper{background:#fffef8;border:1px solid #e9e4d4;border-radius:6px;padding:16px 18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.45;box-shadow:0 2px 0 #f1ecdc}
.paper .c{text-align:center}.paper .b{font-weight:700}.paper .big{font-size:15px}
.paper .hr{border-top:1px dashed #cfc8b2;margin:8px 0}

.paper .pl{margin:4px 0}
.paper .mk{color:#7b5cc4}
.paper .rcqr{width:120px;height:120px;margin:10px auto 0}
.demo-stamp{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.3px;color:#b4442f;border:1px dashed #e0a596;border-radius:6px;padding:3px 6px;margin-bottom:10px;font-family:var(--font)}

/* ===== Бонусы и вход ===== */
.loy{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:4px 0 12px;text-align:left;width:100%;border:1.5px solid transparent;font-family:inherit;color:inherit}
.loy .li{font-size:20px;line-height:1.1}
.loy.gift{background:#f3fbe6;border-color:#cfe9a8}
.loy.staff{background:#f1edfb;border-color:#d8cdf3}
.loy.toggle{cursor:pointer}

.loy.toggle.on .ck{background:var(--brand)}
.loy.toggle:not(.on){background:#fff;border-color:var(--line)}
.verified{margin-top:6px;font-size:13px;color:var(--brand);font-weight:600}
.otp{margin-top:8px}
.lnk{background:none;border:0;padding:0;color:var(--blue);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.bal{background:#f3fbe6;border:1.5px solid #cfe9a8;border-radius:14px;padding:14px 16px}
.bal .v{font-size:30px;font-weight:800;letter-spacing:-.5px}
.prog{height:8px;background:#fff;border-radius:999px;overflow:hidden;margin:10px 0 4px}

.hist{border-top:1px solid var(--line);margin-top:6px}
.hist .row{padding:7px 0;border-bottom:1px dashed var(--line);gap:8px}
.hist b.plus{color:var(--green)}
.lrow{justify-content:space-between;margin:6px 0;font-size:13.5px;gap:10px}

.banks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bank{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;font-family:inherit;color:inherit;cursor:pointer}
.bank i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:var(--soft);color:var(--brand)}

.bank.on i{background:var(--brand);color:#fff}
.cardform{background:var(--soft);border-radius:14px;padding:12px 14px}
.cardform .input{background:#fff;letter-spacing:.5px}
.cardform .brand{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:700}

/* тренер: ID и начисления */
.bal.trainer{background:#f1edfb;border-color:#d8cdf3}
/* имитация страницы оплаты банка */
.bank-dh{background:#eef1f4}
.bankpage{background:#f5f7f9}
.bp-top{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:10px 12px}
.bp-top .lock{font-size:20px}
.bp-demo{margin:8px 0;font-size:12px;color:#6b5a1e;background:#fff7e0;border:1px dashed #e6c76b;border-radius:10px;padding:8px 10px}
.bp-sum{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:12px;margin:8px 0}
.bp-amt{font-size:24px;font-weight:800;letter-spacing:-.3px}
.bp-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e4e9ee;border-radius:12px;padding:4px;margin:10px 0}
.bp-tabs button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;font-family:inherit;color:#40505c;cursor:pointer}
.bp-tabs button.on{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bp-card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:12px}
.bp-card .input{letter-spacing:.4px}
.bp-card .brand{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#f1f3f5;border:1px solid #dde3e8;font-size:11px;font-weight:700}
.rcrow .btn.sm+.btn.sm{margin-left:6px}

.otp{margin-top:8px}
.callsim{display:flex;gap:10px;align-items:center;margin-top:8px;padding:8px 10px;border-radius:12px;background:#1f2a24;color:#fff;font-size:13px}
.callsim>span:first-child{font-size:20px}
.callsim b{white-space:nowrap;letter-spacing:.3px}
.callsim .tiny{color:#b9c4bd}

.site-head,.admin-head{top:var(--dbh,38px)}

function cellFree(c) { return c.state === 'free' || (c.state === 'reserved' && c.depExp < Date.now() && !c.openFor); }
function allocateCell(oid) {
  const o = clone(S.orders[oid]); if (!o.bag.need) return null;
  if (o.bag.cell) { const c = S.lockers.cells.find(x => x.id === o.bag.cell); if (c && c.state === 'reserved') { c.depTok = rndTok('D-'); c.depExp = Date.now() + 10 * MIN; saveLockers(); return c; } }

function allPicked(o) {

/* клиент нажал «Заказ забрал». part: cup | bag | cafe. Для ячейки, которую клиент ещё не открывал своим QR, нужен force — иначе вернём 'confirm' */

function makeReceipt(o, type, mode, pay, at, fd) {

function canAddMore(d) { return !d.stop && portions(d, needFor(UI.cart)) >= 1; }
function cartAdd(id, n = 1) {
  const d = DISH[id]; if (!d) return;
  if (n > 0 && !canAddMore(d)) { toast('Больше нет в наличии: ' + d.name, 'warn'); return; }
  const q = (UI.cart[id] || 0) + n; if (q <= 0) delete UI.cart[id]; else UI.cart[id] = q; render();
}

function filteredDishes() {
  const q = UI.q.trim().toLowerCase();
  let list = S.catalog.dishes.filter(d => (UI.goal === 'all' || d.goals.includes(UI.goal)) && (UI.type === 'all' || d.type === UI.type) && (UI.type !== 'drink' || UI.sub === 'all' || d.sub === UI.sub) && (!q || (d.name + ' ' + d.desc).toLowerCase().includes(q)));
  const sorters = { pop: (a, b) => (b.hit - a.hit) || (b.pop - a.pop), priceAsc: (a, b) => effPrice(a) - effPrice(b), priceDesc: (a, b) => effPrice(b) - effPrice(a), kcalAsc: (a, b) => a.kcal - b.kcal, protein: (a, b) => b.p - a.p };
  list.sort(sorters[UI.sort] || sorters.pop);
  list.sort((a, b) => (onSale(b) ? 1 : 0) - (onSale(a) ? 1 : 0));
  return list;
}
function drinkGroups(ds) {
  let h = ''; const rest = ds.filter(d => !d.sub);
  DRINK_SUBS.forEach(s => { const g = ds.filter(d => d.sub === s.id); if (g.length) h += `<div class="sub-h"><h3>${s.name}</h3><span class="muted small">${g.length}</span></div><div class="grid">${g.map(dishCard).join('')}</div>`; });

function clientStatus(o) {

    if (o.bag.need && o.bag.depositedAt && !o.bag.pickedAt) left.push('в ячейке ' + o.bag.cell);

}
const whereLabel = o => o.mode === 'cafe' ? 'кафе' : o.bag.need ? (o.cup.need ? 'ячейка + стойка' : 'ячейка') : 'стойка ресепшена';
const mm = ms => Math.round(ms / MIN);

/* ===== Кухня ===== */
function kitchenTabs() {
  const p = plan(), now = Date.now();
  const due = st => Object.values(p).filter(x => !x.started && x.start <= now + MIN && (st === 'all' || x.t.st === st)).length;
  const packN = kitchenPackList().length;
  return [['all', 'Все цеха', due('all')], ...STATIONS.map(s => [s.id, s.name, due(s.id)]), ['pack', 'Упаковка', packN]];
}
function kitchenPackList() { return Object.values(S.orders).filter(o => o.tasks && (o.status === 'cooking' || o.status === 'paid') && o.pack.need && !o.pack.done && o.tasks.filter(t => !o.items[t.i].drink).every(t => t.done)); }
function kitchenHead() { return staffHead('Кухня', 'задачи от планировщика', kitchenTabs(), UI.kSt, 'k-st'); }
function ganttSVG(p) {
  const now = Date.now(), from = now - 10 * MIN, to = now + 60 * MIN, W = 1000, L = 110, R = 10, rowH = 26, top = 24;
  const rows = []; STATIONS.forEach(s => { for (let i = 0; i < (st().stations[s.id] || 1); i++) rows.push({ s, i }); });
  const H = top + rows.length * rowH + 8, X = t => L + (Math.max(from, Math.min(to, t)) - from) / (to - from) * (W - L - R);
  let g = '';
  for (let m = 0; m <= 70; m += 10) { const t = from + m * MIN, x = X(t); g += `<line x1="${x}" x2="${x}" y1="${top - 4}" y2="${H - 6}" stroke="#ece8df"/><text x="${x}" y="14" font-size="11" text-anchor="middle" fill="#7a817c">${fmtTime(t)}</text>`; }
  rows.forEach((r, k) => { const y = top + k * rowH; g += `<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="${k % 2 ? '#fbfaf7' : '#fff'}"/><text x="8" y="${y + 17}" font-size="12" font-weight="700" fill="${r.s.color}">${r.s.short}${(st().stations[r.s.id] || 1) > 1 ? ' ' + (r.i + 1) : ''}</text>`; });
  Object.values(p).forEach(x => {
    const k = rows.findIndex(r => r.s.id === x.t.st && r.i === x.si); if (k < 0 || x.end < from || x.start > to) return;
    const y = top + k * rowH + 3, x1 = X(x.start), x2 = Math.max(X(x.end), x1 + 3), w = x2 - x1;
    const fill = x.late ? '#e3463a' : x.started ? '#e8743b' : '#1d6b45', it = x.o.items[x.t.i];
    const label = `№${x.o.no} ${it.n}`; const chars = Math.floor((w - 6) / 6.3);
    g += `<g><rect x="${x1}" y="${y}" width="${w}" height="${rowH - 6}" rx="4" fill="${fill}" fill-opacity="${x.started ? 1 : .85}"><title>№${x.o.no} · ${esc(it.n)} ×${it.q} · ${fmtTime(x.start)}–${fmtTime(x.end)}${x.late ? ' · опаздываем' : ''}</title></rect>${chars > 3 ? `<text x="${x1 + 4}" y="${y + 14}" font-size="11" fill="#fff" pointer-events="none">${esc(label.length > chars ? label.slice(0, chars - 1) + '…' : label)}</text>` : ''}</g>`;
  });
  g += `<line x1="${X(now)}" x2="${X(now)}" y1="${top - 6}" y2="${H - 4}" stroke="#17201b" stroke-width="2"/><text x="${X(now) + 4}" y="${H - 8}" font-size="11" font-weight="700" fill="#17201b">сейчас</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Загрузка цехов на час вперёд">${g}</svg>`;
}
function taskCard(x) {

      <span class="tiny">${STATION[x.t.st].short} · ${it.drink ? 'стакан' : 'в пакет'} → ${whereLabel(o)} к ${fmtTime(o.readyAt)}${x.late ? ` · <span class="bad">опоздание ${lateBy} мин</span>` : ''}</span></div>

    <div class="panel"><div class="row"><h3 style="margin:0">Загрузка цехов на час вперёд</h3><span class="spacer"></span><div class="legend"><span><i style="background:#1d6b45"></i>запланировано</span><span><i style="background:#e8743b"></i>готовится</span><span><i style="background:#e3463a"></i>опаздываем</span></div></div>${ganttSVG(p)}

      else parts += partRow('⚠️', 'Бронь ячейки истекла', '', `<button class="btn sm" data-act="w-cell" data-id="${o.id}">Получить ячейку</button>`);

function promoRecs() {
  const recs = [], today = new Date();
  S.catalog.ingredients.forEach(i => {
    if (i.shelf > 10) return;
    const dn = avgDailyNeed(i.id), av = available(i.id), days = Math.min(i.shelf, 4);
    if (dn > 0 && av > dn * days * 1.3) {
      S.catalog.dishes.filter(d => !d.discount && !d.stop && d.recipe.some(x => x.ing === i.id))
        .sort((a, b) => b.recipe.find(x => x.ing === i.id).qty - a.recipe.find(x => x.ing === i.id).qty).slice(0, 2)
        .forEach(d => recs.push({ ic: '🏷️', dish: d, sale: 20, text: `<b>${esc(i.name)}</b>: на складе ${fmtQty(av, i.unit)}, а за ${days} дн. до конца срока уйдёт ≈${fmtQty(dn * days, i.unit)}. Скидка на «${esc(d.name)}» разгонит спрос.` }));
    }
  });
  S.catalog.dishes.filter(d => d.hit && !d.stop).forEach(d => {
    const f = forecastDish(d, today) * dayRemainFrac(), p = portions(d);
    if (p < f) { const li = ING[limitingIng(d)]; recs.push({ ic: '⚠️', text: `Хит «<b>${esc(d.name)}</b>»: осталось ${p} порц., а до закрытия ожидаем ≈${Math.ceil(f)}. Узкое место — ${esc(li ? li.name : '')}. Проверьте закупку.`, go: 'purchasing' }); }
  });
  return recs;
}

/* ----- Закупки ----- */
function colChart(vals, labels, { split = -1, h = 210, fmt = v => fmtNum(v), mark = -1 } = {}) {
  const W = 1000, pl = 44, pr = 8, pt = 10, pb = 26, n = vals.length;
  const max = Math.max(1, ...vals), step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step * 1.1) * step;
  const bw = (W - pl - pr) / n, y = v => pt + (h - pt - pb) * (1 - v / top);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = top * k / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#ebe7de"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#7a817c">${fmtNum(v)}</text>`; }
  vals.forEach((v, k) => {
    const fut = split >= 0 && k >= split, x = pl + k * bw + bw * 0.15, w = bw * 0.7;
    g += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, h - pb - y(v))}" rx="3" fill="${fut ? '#c9f26b' : k === mark ? '#e8743b' : '#1d6b45'}" ${fut ? 'stroke="#8fb33a"' : ''}><title>${labels[k]}: ${fmt(v)}</title></rect>`;
    if (k % 7 === 0 || k === split || k === n - 1) g += `<text x="${x + w / 2}" y="${h - 8}" text-anchor="middle" font-size="11" fill="${k === split ? '#17201b' : '#7a817c'}" font-weight="${k === split ? 700 : 400}">${k === split ? 'сегодня' : labels[k]}</text>`;
  });
  if (split >= 0) g += `<line x1="${pl + split * bw}" x2="${pl + split * bw}" y1="${pt}" y2="${h - pb}" stroke="#17201b" stroke-dasharray="4 4"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}

function dashboardView() {

  const paid = today.filter(o => o.status !== 'cancelled'), rev = paid.reduce((s, o) => s + paidOf(o), 0);
  const done = today.filter(o => ['placed', 'done'].includes(o.status) && o.history.placed);
  const ontime = done.length ? done.filter(o => o.history.placed <= o.readyAt + 60e3).length / done.length * 100 : 100;
  const gymN = paid.filter(o => o.mode === 'gym').length;
  const d0 = startOfDay(new Date()), revDays = [], labels = [], byDish = {}, byGoal = {};
  for (let k = HISTORY_DAYS; k >= 1; k--) {
    const d = addDays(d0, -k); let r = 0;
    S.catalog.dishes.forEach(x => { const n = histSales(x, d); r += n * effPrice(x); byDish[x.id] = (byDish[x.id] || 0) + n; x.goals.forEach(g => { byGoal[g] = (byGoal[g] || 0) + n; }); });
    revDays.push(r); labels.push(d.getDate() + ' ' + MON[d.getMonth()]);

  const top = Object.entries(byDish).sort((a, b) => b[1] - a[1]).slice(0, 10), topMax = top[0] ? top[0][1] : 1;
  const goals = GOALS.map(g => [g, byGoal[g.id] || 0]).sort((a, b) => b[1] - a[1]), gMax = goals[0][1] || 1;
  const total28 = revDays.reduce((s, v) => s + v, 0);
  return `<div class="ah"><h2>Сводка</h2><span class="muted">сегодня, ${fmtDate(now)}</span></div>
    <div class="kpis">

      <div class="kpi"><div class="l">Средний чек</div><div class="v">${fmtRub(paid.length ? rev / paid.length : 0)}</div><div class="s">&nbsp;</div></div>
      <div class="kpi ${ontime < 90 ? 'warn' : ''}"><div class="l">Готово к сроку</div><div class="v">${fmtNum(ontime)}%</div><div class="s">заказ в ячейке, на стойке или полке не позже времени клиента</div></div>
      <div class="kpi"><div class="l">Выручка за 28 дней</div><div class="v">${fmtRub(total28)}</div><div class="s">≈ ${fmtRub(total28 / 28)} в день</div></div>
    </div>
    <div class="panel"><h3>Выручка по дням за 4 недели, ₽</h3>${colChart(revDays, labels, { fmt: v => fmtRub(v) })}</div>
    <div class="grid2">
      <div class="panel"><h3>Спрос по целям питания (порций за 28 дней)</h3>${goals.map(([g, v]) => `<div class="bar-h"><span class="lb">${g.icon} ${g.name}</span><span class="tr"><i style="width:${v / gMax * 100}%;background:${g.color}"></i></span><span class="vl">${fmtNum(v)}</span></div>`).join('')}</div>
      <div class="panel"><h3>Топ-10 блюд (порций за 28 дней)</h3>${top.map(([id, v]) => `<div class="bar-h"><span class="lb">${DISH[id].emoji} ${esc(DISH[id].name)}</span><span class="tr"><i style="width:${v / topMax * 100}%"></i></span><span class="vl">${fmtNum(v)}</span></div>`).join('')}</div>

}

  't-pack': el => { packDone(el.dataset.id); const o = byId(el.dataset.id); if (o && o.status === 'ready') toast(`№${o.no} упакован — передан официанту`, 'ok'); render(); },

  'w-tab': el => { UI.wTab = el.dataset.v; render(); },
  'w-take': el => { const c = takeOrder(el.dataset.id); const o = byId(el.dataset.id); if (o && o.status === 'delivering') toast(c ? `№${o.no}: ячейка ${c.id}, QR на экране` : `№${o.no} в рейсе`, 'ok'); render(); },
  'w-takeall': () => { ordersList().filter(o => o.mode === 'gym' && o.status === 'ready').forEach(o => takeOrder(o.id)); toast('Все готовые заказы в рейсе', 'ok'); render(); },
  'w-cell': el => { allocateCell(el.dataset.id); render(); },
  'w-scan': el => { const c = S.lockers.cells.find(x => x.id === el.dataset.id); if (!c) return; const r = lockerScan(c.depTok); UI.lockMsg = r; toast(r.msg, r.ok ? 'ok' : 'warn', 5000); render(); },
  'w-cup': el => { cupPlaced(el.dataset.id); const o = byId(el.dataset.id); toast(`№${o.no}: заказ доставлен на стойку — клиент видит, что стакан ждёт его`, 'ok'); render(); },
  'w-bag-done': el => { if (bagDelivered(el.dataset.id)) { const o = byId(el.dataset.id); UI.lockMsg = null; toast(`№${o.no}: заказ доставлен в ячейку ${o.bag.cell} — клиенту открыт QR-код`, 'ok'); } else toast('Сначала откройте ячейку QR-кодом у табло', 'warn'); render(); },
  'w-shelf': el => { shelfPlace(el.dataset.id); render(); },
  'w-hand': el => { const o = byId(el.dataset.id); cafeHandOver(el.dataset.id); UI.cafeNo = ''; toast(`Выдано: №${o.no}, ${o.name}`, 'ok'); render(); },
  'lk-scan': el => { UI.lockMsg = lockerScan(el.dataset.v); render(); },
  'lk-scan-in': () => { UI.lockMsg = lockerScan(UI.lockIn); UI.lockIn = ''; render(); },
  'lk-close': el => { lockerClose(el.dataset.id); UI.lockMsg = null; render(); },
  'pick-cup': el => { const o = byId(el.dataset.id), n0 = rcCount(o); if (clientPicked(el.dataset.id, 'cup')) { toast(`Напиток №${o.no} у вас — хорошего дня!`, 'ok'); closingToast(el.dataset.id, n0); } render(); },
  'pick-bag': el => {
    const id = el.dataset.id, cell = (byId(id) || {}).bag?.cell, n0 = rcCount(byId(id)), r = clientPicked(id, 'bag', el.dataset.force === '1');
    if (r === 'confirm') UI.pickConfirm = id;
    else if (r) { UI.pickConfirm = null; UI.lockMsg = null; toast(`Спасибо! Ячейка ${cell} освобождена для следующего заказа. Приятного аппетита!`, 'ok', 5000); closingToast(id, n0); }
    render();
  },
  'pick-cancel': () => { UI.pickConfirm = null; render(); },
  'pick-cafe': el => { const o = byId(el.dataset.id), n0 = rcCount(o); if (clientPicked(el.dataset.id, 'cafe')) { toast(`Заказ №${o.no} получен — приятного аппетита!`, 'ok'); closingToast(el.dataset.id, n0); } render(); },
  'rc-open': el => { UI.modal = { kind: 'receipt', id: el.dataset.id, r: el.dataset.r, back: UI.app === 'client' }; render(); },
  'rc-close-day': () => { const n = closeDeliveredReceipts(); toast(n ? `Выбито чеков «Полный расчёт»: ${n}` : 'Нет доставленных заказов без второго чека', n ? 'ok' : 'info'); render(); },
  'w-release': el => { if (staffRelease(el.dataset.id)) toast(`Ячейка ${el.dataset.id} освобождена`, 'ok'); render(); },

  'm-hit': el => { const d = DISH[el.dataset.id]; d.hit = !d.hit; saveCatalog(); toast(d.hit ? '«' + d.name + '» — хит дня' : 'Убрано из хитов'); render(); },
  'm-stop': el => { const d = DISH[el.dataset.id]; d.stop = !d.stop; saveCatalog(); render(); },
  'm-apply-sale': el => { const d = DISH[el.dataset.id]; d.discount = +el.dataset.v; saveCatalog(); toast('Скидка ' + d.discount + '% на «' + d.name + '» уже на сайте', 'ok'); render(); },
  'm-new': () => { UI.editDish = { id: uid('d'), name: '', type: 'hot', station: 'hot', goals: [], price: 400, weight: '300 г', kcal: 400, p: 30, f: 12, c: 40, cook: 12, emoji: '🍽️', pop: 3, desc: '', serves: 1, recipe: [{ ing: 'chicken', qty: 150 }], hit: false, discount: 0, stop: false }; UI.modal = { kind: 'edit' }; render(); },
  'm-edit': el => { UI.editDish = clone(DISH[el.dataset.id]); UI.modal = { kind: 'edit' }; render(); },
  'ed-goal': el => { const g = el.dataset.v, a = UI.editDish.goals; UI.editDish.goals = a.includes(g) ? a.filter(x => x !== g) : a.concat(g); render(); },
  'ed-addrow': () => { UI.editDish.recipe.push({ ing: S.catalog.ingredients[0].id, qty: 100 }); render(); },
  'ed-delrow': el => { UI.editDish.recipe.splice(+el.dataset.i, 1); render(); },
  'ed-save': () => {
    const d = UI.editDish; if (!d.name.trim()) { toast('Укажите название', 'warn'); return; }
    ['price', 'kcal', 'p', 'f', 'c', 'cook', 'serves'].forEach(k => { d[k] = +d[k] || 0; }); d.serves = d.serves || 1; d.cook = Math.max(1, d.cook);
    d.recipe = d.recipe.filter(r => r.qty > 0);
    const ix = S.catalog.dishes.findIndex(x => x.id === d.id); if (ix >= 0) S.catalog.dishes[ix] = d; else S.catalog.dishes.push(d);
    saveCatalog(); UI.modal = null; UI.editDish = null; toast('Блюдо сохранено и уже на сайте', 'ok'); render();
  },
  'ed-delete': () => { if (!UI.confirmDel) { UI.confirmDel = true; render(); return; } S.catalog.dishes = S.catalog.dishes.filter(x => x.id !== UI.editDish.id); saveCatalog(); UI.modal = null; UI.editDish = null; UI.confirmDel = false; toast('Блюдо удалено'); render(); },
  op: el => { UI.modal = { kind: 'op', type: el.dataset.v, ing: el.dataset.ing || S.catalog.ingredients[0].id, dish: S.catalog.dishes[0].id, qty: el.dataset.v === 'hall' ? 1 : null, note: '' }; render(); },
  'op-save': () => {
    const m = UI.modal, i = ING[m.ing];
    if (m.type === 'hall') { const d = DISH[m.dish], q = +m.qty || 0; if (!d || q <= 0) return; writeOffItems([{ d: d.id, q }], 'hall', 'Зал: ' + d.name + ' × ' + q); saveCatalog(); toast('Списано по техкарте: ' + d.name + ' × ' + q, 'ok'); }
    else {
      const q = +m.qty; if (!i || m.qty === '' || m.qty == null || !(q >= 0)) { toast('Укажите количество', 'warn'); return; }
      if (m.type === 'in') { i.stock += q; addMove(i.id, q, 'in', m.note || 'Приход'); }
      if (m.type === 'waste') { const w = Math.min(q, i.stock); i.stock -= w; addMove(i.id, -w, 'waste', m.note || 'Списание'); }
      if (m.type === 'inv') { const diff = q - i.stock; i.stock = q; addMove(i.id, diff, 'inv', m.note || (diff >= 0 ? 'Излишек' : 'Недостача')); }
      saveCatalog(); toast('Проведено: ' + i.name, 'ok');
    }
    UI.modal = null; render();
  },
  'p-promo': () => { S.catalog.settings.promo = !S.catalog.settings.promo; saveCatalog(); render(); },
  'p-all': () => { UI.pAll = !UI.pAll; render(); },
  'p-generate': () => {
    const groups = {};
    S.catalog.ingredients.forEach(i => { const r = planRow(i, UI.pChoice[i.id] || defaultSupplier(i)); if (r.qty > 0) (groups[r.sup.id] = groups[r.sup.id] || { next: r.next, items: [] }).items.push([i.id, r.qty]); });
    const n = Object.keys(groups).length;
    Object.entries(groups).forEach(([sid, g]) => S.catalog.pos.unshift(makePO(S.catalog, sid, 'draft', g.next, g.items)));
    saveCatalog(); toast('Создано заявок: ' + n + '. Проверьте и отправьте поставщикам.', 'ok'); render();
  },
  'po-send': el => {
    const p = S.catalog.pos.find(x => x.id === el.dataset.id); if (!p) return; const s = SUP[p.supplierId];
    const text = `Заявка от кафе «Этажом ниже»\nПоставщик: ${s.name}\nДата поставки: ${fmtDate(p.deliveryDate)}\n\n` + p.items.map(it => `• ${ING[it.ing].name} — ${fmtQty(it.qty, ING[it.ing].unit)}`).join('\n') + `\n\nИтого ≈ ${fmtRub(p.total)}`;
    try { navigator.clipboard.writeText(text).then(() => toast('Текст заявки скопирован — вставьте в письмо или мессенджер'), () => { }); } catch (e) { }
    p.status = 'sent'; p.sentAt = Date.now(); saveCatalog(); toast('Заявка отправлена: ' + s.name, 'ok'); render();
  },
  'po-del': el => { S.catalog.pos = S.catalog.pos.filter(x => x.id !== el.dataset.id); saveCatalog(); render(); },
  'po-recv': el => { UI.modal = { kind: 'receive', id: el.dataset.id }; UI.rcv = null; render(); },
  'po-recv-ok': el => {
    const p = S.catalog.pos.find(x => x.id === el.dataset.id); if (!p) return;
    p.items.forEach((it, ix) => { const q = UI.rcv && UI.rcv[ix] != null ? +UI.rcv[ix] : it.qty; const i = ING[it.ing]; if (!i || !(q > 0)) return; i.stock += q; addMove(i.id, q, 'in', 'Приёмка: ' + SUP[p.supplierId].name); it.got = q; });
    p.status = 'received'; p.receivedAt = Date.now(); saveCatalog(); UI.modal = null; UI.rcv = null; toast('Поставка принята, остатки обновлены', 'ok'); render();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('overlay') && e.target !== el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (UI.modal || UI.drawer)) { if (UI.modal) ACT['close-modal'](); else ACT['close-drawer'](); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.ui === 'lockIn') ACT['lk-scan-in']();
});
document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset || {};
  if (ds.otp === 'code') { t.value = t.value.replace(/\D/g, '').slice(0, 4); UI.otpCode = t.value; if (t.value.length === 4) otpVerify(); return; }
  if (ds.co === 'phone') { UI.co.phone = t.value; const k = coKey(); if (k && isKnownPhone(k)) prefillKnown(); renderSoon(350); return; }
  if (ds.co) {
    if (ds.co === 'num') { const d = t.value.replace(/\D/g, '').slice(0, 19); t.value = d.replace(/(\d{4})(?=\d)/g, '$1 '); }
    if (ds.co === 'exp') { const d = t.value.replace(/\D/g, '').slice(0, 4); t.value = d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; }
    if (ds.co === 'cvc') t.value = t.value.replace(/\D/g, '').slice(0, 3);
    UI.co[ds.co] = t.value;
    if (UI.payErr && ['num', 'exp', 'cvc'].includes(ds.co)) { UI.payErr = ''; renderSoon(400); }
    if (ds.co === 'time') renderSoon(400); if (ds.co === 'trainer') renderSoon(250); if (ds.co === 'num') renderSoon(500);
    return;
  }
  if (ds.f === 'q') { UI.q = t.value; renderSoon(160); return; }
  if (ds.ui) { UI[ds.ui] = t.value; if (ds.ui !== 'lockIn') renderSoon(160); return; }
  if (ds.ed) { UI.editDish[ds.ed] = t.value; return; }
  if (ds.edr) { const r = UI.editDish.recipe[+ds.i]; if (r) r[ds.edr] = ds.edr === 'qty' ? +t.value : t.value; return; }
  if (ds.op) { UI.modal[ds.op] = t.value; return; }
  if (ds.rcv != null) { UI.rcv = UI.rcv || {}; UI.rcv[+ds.rcv] = t.value; return; }
  if (ds.set) { S.catalog.settings[ds.set] = +t.value; _cache = {}; renderSoon(80); return; }
});
document.addEventListener('change', e => {
  const t = e.target, ds = t.dataset || {};
  if (ds.f === 'sort') { UI.sort = t.value; render(); return; }
  if (ds.uiSel === 'sbpOther') { if (t.value) { UI.co.bank = t.value; LS.set('en-sbp-bank', t.value); UI.payErr = ''; } render(); return; }
  if (ds.uiSel) { UI[ds.uiSel] = t.value; render(); return; }
  if (ds.dish) { const d = DISH[ds.id]; if (!d) return; let v = Math.max(0, +t.value || 0); if (ds.dish === 'discount') v = Math.min(90, v); d[ds.dish] = v; saveCatalog(); render(); return; }
  if (ds.set) { S.catalog.settings[ds.set] = +t.value; saveCatalog(); render(); return; }
  if (ds.lset) { const L = lset(); L[ds.lset] = t.type === 'checkbox' ? t.checked : Math.max(0, +t.value || 0); saveCatalog(); toast('Правила программы сохранены — действуют для новых заказов', 'ok'); render(); return; }
  if (ds.fset) { const f = fset(), num = ['cardFee', 'sbpFee', 'feeVat'].includes(ds.fset); f[ds.fset] = t.type === 'checkbox' ? t.checked : num ? Math.max(0, +String(t.value).replace(',', '.') || 0) : t.value; saveCatalog(); toast('Настройки кассы сохранены — действуют для новых заказов', 'ok'); render(); return; }
  if (ds.setp) { const [a, b] = ds.setp.split('.'); const v = Math.max(0, +t.value || 0); if (b) S.catalog.settings[a][b] = a === 'stations' ? Math.max(1, v) : v; else S.catalog.settings[a] = v; saveCatalog(); toast('Планировщик пересчитал задачи'); render(); return; }
  if (ds.pchoice != null) { UI.pChoice[ds.id] = t.value; render(); return; }
  if (ds.ed) { UI.editDish[ds.ed] = t.value; if (['type', 'price', 'station'].includes(ds.ed)) render(); return; }
  if (ds.edr) { const r = UI.editDish.recipe[+ds.i]; if (r) r[ds.edr] = ds.edr === 'qty' ? +t.value : t.value; render(); return; }
  if (ds.op) { UI.modal[ds.op] = t.value; if (ds.op === 'ing' || ds.op === 'dish') render(); return; }
});
function onOrdersChanged(before) {
  notifyMyOrders(before);
  Object.values(S.orders).forEach(o => {
    const b = before[o.id];
    if (!b && o.status === 'paid' && UI.app === 'kitchen') toast(`Новый заказ №${o.no} · к ${fmtTime(o.readyAt)} · планировщик поставил задачи`, 'ok', 6000);
    if (b && b.status !== 'ready' && o.status === 'ready' && UI.app === 'waiter') toast(`№${o.no} готов к выносу (${whereLabel(o)})`, 'ok', 6000);
  });
}

/* ===== Старт ===== */
function boot() {
  loadLocal(); readHash(); render();
  if (BC) BC.onmessage = () => { if (S.mode === 'local') syncFromLocal(); };
  window.addEventListener('storage', e => { if (S.mode === 'local' && [LS_CAT, LS_ORD, LS_LOCK].includes(e.key)) syncFromLocal(); });
  setInterval(() => {
    const busy = UI.modal || (UI.app === 'client' && UI.drawer && UI.drawer !== 'checkout' && UI.drawer !== 'cart');
    if (!busy) { _cache = {}; render(); } else { const c = $('.clock'); if (c) c.textContent = fmtTime(Date.now()); }
  }, 15000);
  initDb();
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
